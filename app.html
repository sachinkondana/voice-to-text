<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Voice2Text">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">

    <title>Voice to Text</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Voice to Text</h1>
            <p>Convert your speech into text instantly</p>
        </header>

        <main>
            <div class="visualizer-container" id="visualizer">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>

            <div class="controls">
                <button id="recordBtn" class="btn-record">
                    <span class="icon">🎙️</span>
                    <span class="text">Start Recording</span>
                </button>
            </div>

            <div class="output-container">
                <textarea id="transcript" placeholder="Your text will appear here..." readonly></textarea>
                <div class="actions">
                    <button id="copyBtn" class="btn-action" title="Copy to Clipboard">
                        <span class="icon">📋</span> Copy
                    </button>
                    <button id="clearBtn" class="btn-action" title="Clear Text">
                        <span class="icon">🗑️</span> Clear
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
